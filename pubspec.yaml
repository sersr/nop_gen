name: nop_gen
description: route generator for flutter_nop plugin
version: 0.4.3
repository: https://github.com/sersr/nop_gen

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  source_gen: ^4.2.0
  analyzer: ^13.3.0
  build: ^4.0.7
  nop: ^0.3.1
  pub_semver: any

dev_dependencies:
  test: ^1.16.4
  build_runner: any
  lints: ^2.0.0

dependency_overrides:
  nop:
    path: ../nop